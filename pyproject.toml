[project]
name = "raingist"
version = "0.1.0"
description = "Turns TikToks saved to a Raindrop.io \"raingist\" collection into terse, searchable notes (summary, tags, title), then files each one into a matching collection. Self-hosted on an M1 Mac: local Whisper (MLX) and Apple Vision OCR, Gemini for the summary."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1.13.0",
    "google-genai>=2.30.1",
    "httpx>=0.28.1",
    "huggingface-hub>=2.2.0",
    "mlx-whisper>=0.4.3",
    "ocrmac>=1.0.1",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "yt-dlp[default]>=2026.8.19",
]

[project.scripts]
raingist = "raingist.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
python-preference = "only-system"
python-downloads = "never"
